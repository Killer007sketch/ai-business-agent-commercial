services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_business_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_business_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_business_agent
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      BUSINESS_CONFIG_PATH: ${BUSINESS_CONFIG_PATH:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-AI Business Agent}
      EMAIL_ANALYZE_INBOUND: ${EMAIL_ANALYZE_INBOUND:-false}
      EMAIL_AUTO_REPLY: ${EMAIL_AUTO_REPLY:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
